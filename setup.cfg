[metadata]
name = penelle
version = 0.1.0
description = AI-powered research writing pipeline
long_description = file: README.md
long_description_content_type = text/markdown
author = PenEllE Team
author_email = team@penelle.ai
license = MIT
license_files = LICENSE
url = https://github.com/penelle/penelle
project_urls =
    Documentation = https://penelle.readthedocs.io
    Source = https://github.com/penelle/penelle
    Tracker = https://github.com/penelle/penelle/issues
classifiers =
    Development Status :: 3 - Alpha
    Intended Audience :: Science/Research
    License :: OSI Approved :: MIT License
    Programming Language :: Python :: 3
    Programming Language :: Python :: 3.11
    Programming Language :: Python :: 3.12
    Topic :: Scientific/Engineering :: Artificial Intelligence
    Topic :: Text Processing :: Linguistic

[options]
python_requires = >=3.11
packages = find:
package_dir =
    = src
include_package_data = True
zip_safe = False
install_requires =
    fastapi>=0.104.0
    uvicorn[standard]>=0.24.0
    sqlalchemy>=2.0.0
    alembic>=1.12.0
    asyncpg>=0.29.0
    psycopg2-binary>=2.9.0
    pgvector>=0.2.0
    boto3>=1.29.0
    aioboto3>=12.0.0
    redis>=5.0.0
    pydantic>=2.5.0
    pydantic-settings>=2.1.0
    jsonschema>=4.20.0
    python-jose[cryptography]>=3.3.0
    passlib[bcrypt]>=1.7.0
    python-multipart>=0.0.6
    aiofiles>=23.2.0
    structlog>=23.2.0
    opentelemetry-api>=1.21.0
    opentelemetry-sdk>=1.21.0
    httpx>=0.25.0

[options.packages.find]
where = src
exclude =
    tests*
    docs*

[options.extras_require]
dev =
    pytest>=7.4.0
    pytest-asyncio>=0.21.0
    pytest-cov>=4.1.0
    pytest-mock>=3.12.0
    black>=23.11.0
    ruff>=0.1.6
    mypy>=1.7.0
    pre-commit>=3.5.0
llm =
    ollama>=0.1.7
    openai>=1.3.0
    anthropic>=0.7.0
    transformers>=4.35.0
docs =
    sphinx>=7.2.0
    sphinx-rtd-theme>=2.0.0
    sphinx-autodoc-typehints>=1.25.0
    myst-parser>=2.0.0

[flake8]
max-line-length = 100
max-complexity = 10
exclude = 
    .git,
    __pycache__,
    build,
    dist,
    .eggs,
    *.egg,
    venv,
    .venv,
    migrations,
    .tox,
    .pytest_cache,
    .mypy_cache,
    .ruff_cache
ignore = E203,E501,W503,W504,B008,C901
per-file-ignores =
    __init__.py: F401
    tests/*: S101,S105,S106
docstring-convention = google
docstring-min-length = 10
count = True
statistics = True

[isort]
profile = black
line_length = 100
multi_line_output = 3
include_trailing_comma = True
force_grid_wrap = 0
use_parentheses = True
ensure_newline_before_comments = True
skip = migrations,.venv,build,dist
known_first_party = src

[mypy]
python_version = 3.11
warn_return_any = True
warn_unused_configs = True
disallow_untyped_defs = True
disallow_incomplete_defs = True
check_untyped_defs = True
disallow_untyped_decorators = True
no_implicit_optional = True
warn_redundant_casts = True
warn_unused_ignores = True
warn_no_return = True
warn_unreachable = True
strict_equality = True
pretty = True
show_error_codes = True
show_error_context = True
show_column_numbers = True

[mypy-tests.*]
ignore_errors = True

[bandit]
targets = src
exclude = /tests/,/venv/,/migrations/
skips = B101,B601,B104
severity = medium
confidence = medium

[pylint]
max-line-length = 100
disable = C0103,C0114,C0115,C0116,R0903,R0913,W0221,E1101
good-names = i,j,k,ex,Run,_,id,db,pk
ignore = migrations,tests
ignore-paths = ^venv/.*$,^build/.*$,^dist/.*$
extension-pkg-whitelist = pydantic
generated-members = 
    db.session.*,
    db.Model.*,
    db.Column.*