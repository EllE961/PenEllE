codecov:
  require_ci_to_pass: true
  bot: "codecov-bot"
  
coverage:
  precision: 2
  round: down
  range: "60...100"
  
  status:
    project:
      default:
        target: 60%
        threshold: 1%
        base: auto
        if_ci_failed: error
        only_pulls: false
    
    patch:
      default:
        target: 60%
        threshold: 1%
        base: auto
        if_ci_failed: error
        only_pulls: false
    
    changes: false

parsers:
  gcov:
    branch_detection:
      conditional: true
      loop: true
      method: false
      macro: false

comment:
  layout: "reach,diff,flags,tree,betaprofiling"
  behavior: default
  require_changes: false
  require_base: false
  require_head: true
  hide_project_coverage: false

ignore:
  - "tests/**/*"
  - "scripts/**/*"
  - "docs/**/*"
  - "**/__pycache__/**/*"
  - "**/migrations/**/*"
  - "setup.py"
  - "**/__init__.py"

flags:
  unittests:
    paths:
      - src/
    carryforward: true
    carryforward_mode: "labels"
  
  integration:
    paths:
      - src/
    carryforward: false

profiling:
  critical_files_paths:
    - src/core/database/models.py
    - src/core/database/repositories/*.py
    - src/core/schemas/validators/*.py
    - src/core/schemas/validation_service.py
    - src/core/auth/jwt_handler.py
    - src/core/auth/rbac.py

github_checks:
  annotations: true