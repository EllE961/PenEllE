[tool:pytest]
minversion = 7.0
testpaths = tests
python_files = test_*.py *_test.py
python_classes = Test*
python_functions = test_*
addopts = 
    -ra
    --strict-markers
    --strict-config
    --cov=src
    --cov-branch
    --cov-report=term-missing:skip-covered
    --cov-report=html
    --cov-report=xml
    --cov-fail-under=60
    --tb=short
    -v
markers =
    unit: Unit tests
    integration: Integration tests
    e2e: End-to-end tests
    slow: Tests that take > 5 seconds (deselect with '-m "not slow"')
    performance: Performance tests
    requires_db: Tests that require database connection
    requires_redis: Tests that require Redis connection
    requires_s3: Tests that require S3/MinIO connection
    requires_pgvector: Tests that require pgvector extension
    requires_embeddings: Tests that require embedding models
asyncio_mode = auto
filterwarnings = 
    error
    ignore::UserWarning
    ignore::DeprecationWarning
    ignore:.*unclosed.*:ResourceWarning
env_files = 
    .env.test
norecursedirs = 
    .git
    .tox
    dist
    build
    *.egg
    venv
    migrations
    __pycache__
log_cli = true
log_cli_level = INFO
log_cli_format = %(asctime)s [%(levelname)s] %(message)s
log_cli_date_format = %Y-%m-%d %H:%M:%S
junit_family = xunit2
junit_logging = all
junit_log_passing_tests = true
junit_duration_report = total
timeout = 300
timeout_method = thread
console_output_style = progress