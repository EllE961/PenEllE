name: Dependency Update & Security Scan

on:
  schedule:
    # Run every Monday at 8 AM UTC
    - cron: '0 8 * * 1'
  workflow_dispatch:

jobs:
  update-dependencies:
    name: Update Dependencies
    runs-on: ubuntu-latest
    
    steps:
    - uses: actions/checkout@v4
      with:
        token: ${{ secrets.GITHUB_TOKEN }}
    
    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: "3.11"
    
    - name: Install pip-tools
      run: |
        python -m pip install --upgrade pip
        pip install pip-tools
    
    - name: Update requirements
      run: |
        # Compile requirements from requirements.in if it exists
        if [ -f requirements.in ]; then
          pip-compile requirements.in --upgrade
        fi
        
        # Update all packages to latest compatible versions
        pip list --outdated --format json > outdated.json
        
    - name: Security audit
      run: |
        pip install safety pip-audit
        
        # Run safety check
        safety check --json > safety-report.json || true
        
        # Run pip-audit
        pip-audit --desc --format json --output pip-audit-report.json || true
    
    - name: Create pull request
      uses: peter-evans/create-pull-request@v5
      with:
        token: ${{ secrets.GITHUB_TOKEN }}
        commit-message: "chore: update dependencies"
        title: "chore: automated dependency updates"
        body: |
          ## Automated Dependency Update
          
          This PR contains automated dependency updates.
          
          ### Security Report
          See attached security scan results.
          
          ### Changes
          - Updated dependencies to latest compatible versions
          - Ran security audits
          
          Please review the changes and ensure all tests pass before merging.
        branch: automated-dependency-update
        delete-branch: true

  vulnerability-scan:
    name: Vulnerability Scanning
    runs-on: ubuntu-latest
    
    steps:
    - uses: actions/checkout@v4
    
    - name: Run Trivy vulnerability scanner
      uses: aquasecurity/trivy-action@master
      with:
        scan-type: 'fs'
        scan-ref: '.'
        format: 'sarif'
        output: 'trivy-results.sarif'
        severity: 'CRITICAL,HIGH,MEDIUM'
    
    - name: Upload Trivy scan results to GitHub Security
      uses: github/codeql-action/upload-sarif@v2
      with:
        sarif_file: 'trivy-results.sarif'
    
    - name: Run OSV Scanner
      uses: google/osv-scanner-action@v1
      with:
        scan-args: |-
          --format=sarif
          --output=osv-results.sarif
          /
    
    - name: Upload OSV scan results
      uses: github/codeql-action/upload-sarif@v2
      with:
        sarif_file: 'osv-results.sarif'
    
    - name: OWASP Dependency Check
      uses: dependency-check/Dependency-Check_Action@main
      with:
        project: 'PenEllE'
        path: '.'
        format: 'HTML'
        args: >
          --enableRetired
          --enableExperimental
    
    - name: Upload OWASP results
      uses: actions/upload-artifact@v4
      with:
        name: owasp-dependency-check-report
        path: reports/

  license-check:
    name: License Compliance Check
    runs-on: ubuntu-latest
    
    steps:
    - uses: actions/checkout@v4
    
    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: "3.11"
    
    - name: Install license checker
      run: |
        pip install pip-licenses
    
    - name: Check licenses
      run: |
        pip-licenses --format=markdown --output-file=licenses.md
        pip-licenses --format=json --output-file=licenses.json
        
        # Check for copyleft licenses
        pip-licenses --fail-on="GPL;LGPL;AGPL;MPL" || echo "::warning::Found copyleft licenses"
    
    - name: Upload license report
      uses: actions/upload-artifact@v4
      with:
        name: license-report
        path: |
          licenses.md
          licenses.json